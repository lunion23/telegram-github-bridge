name: Build Android APK & Send to Telegram
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Instal Alat Unzip
      run: sudo apt-get update && sudo apt-get install -y unzip
      
    - name: Ekstrak File ZIP
      run: |
        ZIP_FILE=$(ls *.zip | head -n 1)
        ZIP_NAME=$(basename "$ZIP_FILE" .zip)
        echo "APK_NAME=${ZIP_NAME}.apk" >> $GITHUB_ENV
        unzip -o "$ZIP_FILE" -d .
      
    - name: Perbaiki Isu Keystore
      run: |
        if [ -f app/build.gradle.kts ]; then
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts
        fi
        
    - name: Siapkan Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK Debug
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi
        # Salin dan ubah nama APK agar sesuai dengan nama file ZIP
        cp app/build/outputs/apk/debug/app-debug.apk ${{ env.APK_NAME }}

    - name: Kirim File APK Langsung ke Telegram
      if: success() && env.TELEGRAM_BOT_TOKEN != ''
      run: |
        curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
             -F document=@"${{ env.APK_NAME }}" \
             -F caption="✅ *Build APK Berhasil!*%0ANama File: `${{ env.APK_NAME }}`" \
             "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
